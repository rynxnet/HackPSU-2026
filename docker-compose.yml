services:
  # -------------------------------------------------------------
  # Postgres with pgvector extension (vectors, metadata, chunks)
  # -------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: researchide-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-researchide}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d researchide"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - researchide-network

  # -------------------------------------------------------------
  # Backend API (FastAPI + Gemini RAG + Chunking + Vector Search)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: researchide-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-researchide}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-researchide}
      - STORAGE_BACKEND=local
      - LOCAL_STORAGE_DIR=/app/storage
      - GROBID_URL=http://grobid:8070
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_CHAT_MODEL=${GEMINI_CHAT_MODEL:-gemini-3.5-flash}
      - GEMINI_FALLBACK_MODELS=${GEMINI_FALLBACK_MODELS:-gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-flash-lite-latest,gemini-flash-latest}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_storage:/app/storage
    networks:
      - researchide-network

  # -------------------------------------------------------------
  # Frontend Client (Next.js 14 App Router + Monaco + PDF.js + Tailwind)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: researchide-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
      # Docker on Windows/macOS does not forward file change events into bind mounts;
      # poll so `next dev` picks up edits
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - researchide-network

  # -------------------------------------------------------------
  # Optional: GROBID Academic Parser (use --profile grobid to enable)
  # -------------------------------------------------------------
  grobid:
    image: grobid/grobid:0.8.1-crf
    container_name: researchide-grobid
    profiles: ["grobid"]
    restart: unless-stopped
    ports:
      - "8070:8070"
    networks:
      - researchide-network

networks:
  researchide-network:
    driver: bridge

volumes:
  postgres_data:
  backend_storage:
